<div id="migration-calculator">
  <h3>Migration Period Calculator</h3>

  <label for="fy-end">Financial year end</label>
  <input type="date" id="fy-end">

  <button onclick="calculateMigrationPeriod()">Calculate</button>

  <div id="result" style="display: none;">
    <p>
      <strong>Total period:</strong><br>
      <span id="total-period"></span>
    </p>

    <p><strong>Being:</strong></p>

    <div id="periods"></div>
  </div>
</div>

<script>
function calculateMigrationPeriod() {
  const input = document.getElementById("fy-end").value;

  if (!input) {
    alert("Please enter your financial year end date.");
    return;
  }

  const fyEnd = new Date(input);
  const today = new Date();

  // Remove time component
  today.setHours(0, 0, 0, 0);

  // The migration period must start in the calendar year
  // two years before the current calendar year.
  const startYear = today.getFullYear() - 2;

  // Financial year starts the day after the supplied year end.
  const startDate = new Date(
    startYear,
    fyEnd.getMonth(),
    fyEnd.getDate() + 1
  );

  // Ensure the start date remains in the target year.
  startDate.setFullYear(startYear);

  const formatDate = date =>
    date.toLocaleDateString("en-GB", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });

  // Display total period
  document.getElementById("total-period").textContent =
    `${formatDate(startDate)} - ${formatDate(today)}`;

  // Build individual financial periods
  const periodsContainer = document.getElementById("periods");
  periodsContainer.innerHTML = "";

  let periodStart = new Date(startDate);
  let periodNumber = 1;

  while (periodStart <= today) {

    // The normal end of this financial period
    const periodEnd = new Date(periodStart);
    periodEnd.setFullYear(periodEnd.getFullYear() + 1);
    periodEnd.setDate(periodEnd.getDate() - 1);

    // Don't allow the period to extend beyond today
    const actualEnd = periodEnd > today ? today : periodEnd;

    const period = document.createElement("p");

    period.innerHTML =
      `<strong>Period ${periodNumber}:</strong><br>
       ${formatDate(periodStart)} - ${formatDate(actualEnd)}`;

    periodsContainer.appendChild(period);

    // If this period ends today, we're finished
    if (actualEnd.getTime() === today.getTime()) {
      break;
    }

    // Next period starts the following day
    periodStart = new Date(actualEnd);
    periodStart.setDate(periodStart.getDate() + 1);

    periodNumber++;
  }

  document.getElementById("result").style.display = "block";
}
</script>
